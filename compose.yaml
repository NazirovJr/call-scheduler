services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: callscheduler
      POSTGRES_USER: callscheduler
      POSTGRES_PASSWORD: callscheduler
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callscheduler -d callscheduler"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/callscheduler
    depends_on:
      db:
        condition: service_healthy

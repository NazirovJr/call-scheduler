spring:
  application:
    name: call-scheduler
  datasource:
    url: jdbc:postgresql://localhost:5432/callscheduler
    username: callscheduler
    password: callscheduler
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    mapper:
      accept-case-insensitive-enums: true
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        write-enums-to-lowercase: true
        fail-on-numbers-for-enums: true
  data:
    web:
      pageable:
        serialization-mode: via_dto
